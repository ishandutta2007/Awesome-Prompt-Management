<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0d111d" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#f43f5e;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#38bdf8;#c084fc;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#f43f5e;#38bdf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 56px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 22px;
      fill: #94a3b8;
      letter-spacing: 2px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 14px;
      fill: #38bdf8;
    }
    .grid-line {
      stroke: #1e293b;
      stroke-width: 1;
      opacity: 0.4;
    }
    .pulse-circle {
      animation: pulse 3s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { r: 4px; opacity: 0.3; }
      100% { r: 12px; opacity: 0.9; }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- Background Grid Mesh -->
  <g class="grid">
    <line x1="100" y1="0" x2="100" y2="400" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="400" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="400" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="400" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="400" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="400" class="grid-line" />

    <line x1="0" y1="80" x2="1200" y2="80" class="grid-line" />
    <line x1="0" y1="160" x2="1200" y2="160" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="320" x2="1200" y2="320" class="grid-line" />
  </g>

  <!-- Animated Glowing Neural / Prompt Nodes -->
  <g>
    <!-- Node Connections -->
    <path d="M 150 120 L 300 220 L 450 140 L 750 260 L 1050 160" stroke="#818cf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M 200 280 L 400 180 L 650 300 L 950 120" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,8" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="32" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Animated Glowing Circles -->
    <circle cx="150" cy="120" r="8" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="6;10;6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="300" cy="220" r="10" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="r" values="8;14;8" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="450" cy="140" r="7" fill="#f43f5e" filter="url(#glow)">
      <animate attributeName="r" values="5;9;5" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="750" cy="260" r="9" fill="#38bdf8" filter="url(#glow)">
      <animate attributeName="r" values="7;12;7" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="160" r="11" fill="#818cf8" filter="url(#glow)">
      <animate attributeName="r" values="8;15;8" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(450, 85)">
    <rect x="0" y="0" width="300" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="150" y="22" text-anchor="middle" class="badge-text">⚡ TOP PROMPTOPS &amp; LLMOPS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="195" text-anchor="middle" class="title" filter="url(#glow)">Awesome Prompt Management</text>

  <!-- Subtitle -->
  <text x="600" y="250" text-anchor="middle" class="subtitle">PROMPT REGISTRIES • EVALUATION • OBSERVABILITY • AI GATEWAYS</text>

  <!-- Bottom Accent Line -->
  <rect x="250" y="310" width="700" height="4" rx="2" fill="url(#text-grad)" filter="url(#glow)"/>
</svg>
